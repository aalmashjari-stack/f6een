<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>f6een · Styling preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#27241f;font:14px/1.5 system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #147370;outline-offset:3px}header{padding:22px 32px 18px;display:flex;align-items:center;gap:24px;background:#faf8f3;border-bottom:1px solid #d3ccbf}h1{font-size:24px;line-height:1.2;letter-spacing:-.7px;margin:0}h1 span{font-weight:400;color:#716c62}header p{margin:4px 0 0;color:#6e685d;font-size:12px}.status{margin-left:auto;border:1px solid #d2c8b5;border-radius:99px;background:#fff6da;padding:6px 12px;font-size:11px;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:15px 32px;background:#faf8f3}.scenes{display:flex;gap:5px;flex-wrap:wrap}.scenes button,.modes button{border:0;background:transparent;padding:8px 12px;border-radius:7px;color:#675f54}.scenes button[aria-pressed=true]{background:#27241f;color:white}.spacer{flex:1}.modes{display:flex;border:1px solid #d9d2c5;border-radius:9px;padding:3px}.modes button{padding:5px 11px}.modes button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #0002;color:#27241f;font-weight:650}select{padding:8px;border:1px solid #d9d2c5;border-radius:8px;background:transparent}main{padding:22px 32px}.stage{max-width:1440px;margin:auto}.caption{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:#625c52}.caption strong{color:#27241f}.frame{position:relative;overflow:hidden;border-radius:9px;box-shadow:0 0 0 1px #cac2b4,0 12px 32px #332b1710;background:#fff8ee;--split:50%}.frame img{display:block;width:100%;height:auto}.frame .before{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split)) 0 0)}.frame[data-mode=after] .before{display:none}.frame[data-mode=before] .before{clip-path:none}.divider{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:#147370;pointer-events:none;box-shadow:0 0 0 1px #fff9}.divider span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:99px;background:#147370;color:#fff;padding:9px 11px;font-weight:bold}.frame:not([data-mode=split]) .divider{display:none}.slider-row{display:flex;align-items:center;gap:12px;font-size:12px;color:#675f54;max-width:620px;margin:14px auto 0}.slider-row input{flex:1;accent-color:#147370}.slider-row[hidden]{display:none}.notes{max-width:1440px;margin:22px auto 0;display:grid;grid-template-columns:1fr 1.6fr;gap:28px;border-top:1px solid #d1c9bc;padding-top:18px}.notes h2{margin:0 0 7px;font-size:17px}.notes p{margin:0;color:#6b6458}.notes ul{margin:0;padding-left:19px;color:#504a40}.notes li+li{margin-top:5px}footer{max-width:1440px;margin:20px auto 0;font-size:11px;color:#7b7264;display:flex;justify-content:space-between;gap:16px}a{color:#176c66;text-underline-offset:3px}@media(max-width:800px){header{padding:18px;gap:10px}h1{font-size:20px}.status{font-size:9px;padding:5px 8px}.toolbar{padding:12px 18px;gap:10px}main{padding:14px 18px}.scenes button{padding:7px 8px;font-size:12px}.notes{grid-template-columns:1fr;gap:12px}header p{max-width:230px}.spacer{display:none}}
</style></head><body>
<header><div><h1>f6een <span>/ styling study</span></h1><p>The same game, with a more consistent visual hierarchy.</p></div><div class="status">Preview only · No commits</div></header>
<div class="toolbar"><nav class="scenes" aria-label="Game screen"></nav><div class="spacer"></div><select id="device" aria-label="Preview viewport"><option value="desktop">Desktop · 1440 × 900</option><option value="phone">Landscape phone · 844 × 390</option></select><div class="modes" aria-label="Comparison mode"><button data-mode="before">Before</button><button data-mode="after" aria-pressed="true">Proposed</button><button data-mode="split">Compare</button></div></div>
<main><div class="stage"><div class="caption"><strong id="caption"></strong><span id="version"></span></div><div class="frame" data-mode="after"><img id="after" alt="Proposed styling of the selected game screen"><img class="before" id="before" alt="Existing styling of the same screen"><div class="divider"><span>↔</span></div></div><label class="slider-row" hidden>Before <input type="range" min="0" max="100" value="50" aria-label="Comparison divider">Proposed</label></div>
<section class="notes"><div><h2 id="heading"></h2><p id="description"></p></div><ul id="details"></ul></section><footer><span>Actual game components with sample state. Original logo, artwork, RTL and game rules retained. Screen images are a visual review, not playable controls.</span><a id="full" href="shots/board-desktop-after.png" target="_blank">Open full-size image ↗</a></footer></main>
<script>
const scenes={board:{name:'Board',title:'A clearer board, with the same personality.',description:'Retain the six illustrated category units and all eighteen cells.',details:['One strong frame groups each category. Lighter inner outlines reduce the stacked-border effect.','Larger point values, solid category labels and dashed used cells make the board easier to scan.']},question:{name:'Question',title:'Give the question the strongest voice.',description:'More generous text space and a calmer timer treatment.',details:['Larger Arabic text and more breathing room around the question. Team names stay visible in their established colors.','The timer keeps its number and progress bar; the red warning state remains. The reveal action stays in the same position.']},reveal:{name:'Answer',title:'Make the answer and the next decision distinct.',description:'Retain both team choices and “no one answered”.',details:['A deeper orange answer improves contrast against white. The original question stays legible above it.','Consistent card corners and shallower shadows simplify the scoring area without changing its options.']},endgame:{name:'Results',title:'A results screen that uses the width.',description:'All twelve players, scores and actions in one landscape view.',details:['A warm winner banner anchors the result. Table headers, totals and alternating player rows support comparison.','The phone layout keeps the two columns, fits all twelve players, and brings the new-game and report actions into view.']},long:{name:'Long text',title:'Test the difficult question, too.',description:'The longest text fixture comes from the shipped question bank.',details:['The proposal gives text more vertical room before reducing its font size.','This is a sampled layout check; a production change still needs regression checks across every gameplay phase.']},photo:{name:'Photo',title:'Keep the photo as the question.',description:'Existing image asset and photo interaction are unchanged.',details:['Apply the same scoreboard, border and timer system around the original photo.','No replacement artwork, external images or generative assets are used.']}};
let scene='board',device='desktop',mode='after';const $=s=>document.querySelector(s);for(const [key,v]of Object.entries(scenes)){const b=document.createElement('button');b.textContent=v.name;b.dataset.scene=key;b.onclick=()=>{scene=key;render()};$('.scenes').append(b)}
function render(){const s=scenes[scene];$('#after').src=`shots/${scene}-${device}-after.png`;$('#before').src=`shots/${scene}-${device}-before.png`;$('.frame').dataset.mode=mode;$('#caption').textContent=s.name+(scene==='endgame'?' · 12 players':'');$('#version').textContent=mode==='split'?'Before ← drag divider → Proposed':mode==='before'?'Current styling':'Proposed styling';$('#heading').textContent=s.title;$('#description').textContent=s.description;$('#details').replaceChildren(...s.details.map(x=>{const li=document.createElement('li');li.textContent=x;return li}));$('.slider-row').hidden=mode!=='split';$('#full').href=`shots/${scene}-${device}-${mode==='before'?'before':'after'}.png`;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));}
$('#device').onchange=e=>{device=e.target.value;render()};document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('input[type=range]').oninput=e=>$('.frame').style.setProperty('--split',e.target.value+'%');document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='b'){mode='before';render()}if(e.key==='a'){mode='after';render()}});render();
</script></body></html>
