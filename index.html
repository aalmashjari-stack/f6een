<!doctype html>
<!-- الهويّة «نيو» مثبّتة (قرار علي ٢٧ أغسطس ٢٠٢٦). هنا لا في جافاسكربت:
     ضبطها بعد التحميل يُظهر الشكل القديم ومضةً قبل أن يُستبدَل. -->
<html lang="ar" dir="rtl" data-skin="blocks">
  <head>
    <meta charset="UTF-8" />
    <!-- الأيقونة طاءُ الشعار وحدها بظلّها (قرار علي ١ سبتمبر ٢٠٢٦): الكلمة
         كاملةً تصير خطوطاً في ١٦ بكسلاً، والطاء وحدها تبقى مقروءة. -->
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/f6een-icon-taa-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/f6een-icon-taa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>فطين</title>
  </head>
  <body>
    <!-- بوابة الاتجاه: تظهر فقط على أجهزة اللمس في الوضع الطولي (media query في theme.css).
         خارج #root عمداً — تعمل حتى قبل تحميل React ولا تتأثر بحالة اللعبة. -->
    <div id="rotate-gate" aria-hidden="true">
      <!-- الشعار مكتوبٌ هنا يدوياً لا من `BrandLogo`: البوّابة تعيش خارج
           `#root`، فلا React فيها. البنيةُ والأصنافُ نفسُها حرفاً بحرف،
           فتلبس أنماطَ `.f6een-mark` كما هي ولا تفترق هويّةً. -->
      <span class="f6een-mark rotate-gate-logo">
        <span class="f6een-word"
          ><span class="f6een-letter f6een-fa">&#xFED3;</span
          ><span class="f6een-letter f6een-taa">&#xFEC4;</span
          ><span class="f6een-letter f6een-yaa">&#xFEF4;</span
          ><span class="f6een-letter f6een-nun">&#xFEE6;</span></span
        ><span class="f6een-spark spark-1"></span>
        <span class="f6een-spark spark-2"></span>
      </span>
      <div class="rotate-gate-card">
        <svg viewBox="0 0 120 120" class="rotate-gate-icon" fill="none">
          <!-- السهمُ ثابتٌ والجهازُ وحده يدور: كانا يدوران معاً فيتداخلان
               ولا تُقرأ الحركة. -->
          <path class="rgi-arc" d="M96 44a38 38 0 0 0-72-6" stroke-width="6"
                stroke-linecap="round" />
          <path class="rgi-arc" d="M22 16v22h22" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" />
          <g class="rgi-phone">
            <rect x="42" y="52" width="36" height="60" rx="8"
                  stroke-width="6" />
            <line x1="42" y1="100" x2="78" y2="100" stroke-width="6" />
          </g>
        </svg>
        <p>أدر جهازك أفقياً للعب</p>
      </div>
      <span class="rotate-gate-sadu" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
