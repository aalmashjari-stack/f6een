<!doctype html>
<!-- الهويّة «نيو» مثبّتة (قرار علي ٢٧ أغسطس ٢٠٢٦). هنا لا في جافاسكربت:
     ضبطها بعد التحميل يُظهر الشكل القديم ومضةً قبل أن يُستبدَل. -->
<html lang="ar" dir="rtl" data-skin="blocks">
  <head>
    <meta charset="UTF-8" />
    <!-- الأيقونة طاءُ الشعار وحدها بظلّها (قرار علي ١ سبتمبر ٢٠٢٦): الكلمة
         كاملةً تصير خطوطاً في ١٦ بكسلاً، والطاء وحدها تبقى مقروءة. -->
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/f6een-icon-taa-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/f6een-icon-taa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>فطين</title>
  </head>
  <body>
    <!-- بوابة الاتجاه: تظهر فقط على أجهزة اللمس في الوضع الطولي (media query في theme.css).
         خارج #root عمداً — تعمل حتى قبل تحميل React ولا تتأثر بحالة اللعبة. -->
    <div id="rotate-gate" aria-hidden="true">
      <svg viewBox="0 0 100 100" class="rotate-gate-icon">
        <rect x="30" y="10" width="40" height="70" rx="7" fill="none" stroke="currentColor" stroke-width="4" />
        <line x1="30" y1="60" x2="70" y2="60" stroke="currentColor" stroke-width="4" />
        <path d="M78 30 a26 26 0 1 1 -8 -19" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        <path d="M78 3 L78 30 L51 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p>أدر جهازك أفقياً للعب</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
