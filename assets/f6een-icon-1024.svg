<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    أيقونة فطين — خليتان سداسيتان متداخلتان.

    الألوان الثلاثة كلها من لوحة الهوية (القسم ١١): الأصفر #FFBD59 والبرتقالي
    #E4674A هما لونا كلمة «فطين» نفسها، والكريمي #F5EFE3 يظهر في التقاطع
    وحده. الخلفية زرقاء ليل الغوص #0F2C42.

    التقاطع لون ثالث لا ظلّ ولا شفافية: الشفافية تتغيّر بتغيّر الخلفية،
    واللون الصريح ثابت في كل قصّ وفي الطباعة.

    السداسي مدبّب الرأس ليطابق خلية التصنيفات داخل التطبيق.
    كتل صلبة بلا فراغ داخلي — تُقرأ حتى ٢٧px حيث تتلبّك الحلقات المفرّغة.

    القياسات: نصف القطر ١٧٥، ومركزا الشكلين على ±١٠٠ من مركز المربع.
    أبعد نقطة ٢٦٦px من المركز — دون حدّ أندرويد التكيّفي (٣٤١)، فالأيقونة
    آمنة للقصّ الدائري والمربع المدوّر بلا اقتطاع.
  -->
  <defs>
    <!-- يقصّ السداسي البرتقالي على حدود الذهبي، فيبقى منه التقاطع وحده -->
    <clipPath id="overlap">
      <polygon points="412,337 563.55,424.5 563.55,599.5 412,687 260.45,599.5 260.45,424.5"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#0F2C42"/>

  <polygon points="412,337 563.55,424.5 563.55,599.5 412,687 260.45,599.5 260.45,424.5" fill="#FFBD59"/>
  <polygon points="612,337 763.55,424.5 763.55,599.5 612,687 460.45,599.5 460.45,424.5" fill="#E4674A"/>
  <g clip-path="url(#overlap)">
    <polygon points="612,337 763.55,424.5 763.55,599.5 612,687 460.45,599.5 460.45,424.5" fill="#F5EFE3"/>
  </g>
</svg>
